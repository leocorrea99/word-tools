name: Build & Release

# Dispara automaticamente quando uma Release é publicada no GitHub
on:
  release:
    types: [published]

permissions:
  contents: write   # necessário para fazer upload dos arquivos na Release

jobs:

  # ── Mac (.dmg) ──────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install PyQt6 python-docx requests pyinstaller

      - name: Build .app
        run: |
          pyinstaller --noconfirm --windowed --onedir \
            --name "WordTools" \
            --add-data "app:app" \
            main.py

      - name: Criar .dmg
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          hdiutil create \
            -volname "WordTools" \
            -srcfolder "dist/WordTools.app" \
            -ov -format UDZO \
            "dist/WordTools-${VERSION}.dmg"
          echo "DMG_FILE=dist/WordTools-${VERSION}.dmg" >> $GITHUB_ENV

      - name: Upload .dmg para Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_FILE }}

  # ── Windows (.exe) ──────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install PyQt6 python-docx requests pywin32 pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --noconfirm --windowed --onefile `
            --name "WordTools" `
            --add-data "app;app" `
            main.py

      - name: Renomear para padrão da Release
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          mv dist/WordTools.exe "dist/WordTools-${VERSION}-Setup.exe"
          echo "EXE_FILE=dist/WordTools-${VERSION}-Setup.exe" >> $GITHUB_ENV

      - name: Upload .exe para Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE_FILE }}
